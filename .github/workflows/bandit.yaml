---
name: Bandit

on:
  push:
    # Only run when pyjsign's own Python source could be affected
    paths: &trigger-paths
      - "src/pyjsign/**"
      - "pyproject.toml"
      - ".github/workflows/bandit.yaml"
  pull_request:
    paths: *trigger-paths

permissions:
  contents: read

jobs:
  bandit:
    runs-on: ubuntu-latest
    permissions:
      # Needed to upload results to the code scanning dashboard
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Run Bandit
        uses: PyCQA/bandit-action@92ae8b82fb422a639f0ed8d99e96cea769594e08 # v1.9.4
        with:
          targets: src/pyjsign
